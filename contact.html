<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — ApparelPro Academy</title>
  <meta name="description" content="Contact ApparelPro Academy by phone, WhatsApp, email, or request a call.">
  <meta name="theme-color" content="#0B1C33">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>
  <main id="main">
    <section class="page-hero weave">
      <div class="container">
        <p class="kicker">Contact</p>
        <h1>Talk to ApparelPro</h1>
        <p>Phone, WhatsApp, email, Facebook, and Messenger. Edit every number and link in js/data.js.</p>
        <div class="stitch"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="contact-grid" id="contact-cards"></div>
        <div class="mt-6" style="display:flex;flex-wrap:wrap;gap:0.75rem" id="contact-socials"></div>
      </div>
    </section>

    <section class="bg-cream section">
      <div class="container split">
        <div>
          <h2>Request a call</h2>
          <p class="text-muted mt-3" style="font-size:0.9rem" id="hours-text"></p>
        </div>
        <div id="call-form-wrap">
          <form id="call-form" class="form-card" novalidate>
            <div class="form-grid">
              <div class="field">
                <label for="call-name">Full name</label>
                <input id="call-name" autocomplete="name">
                <p class="error" data-error="call-name"></p>
              </div>
              <div class="field">
                <label for="call-phone">Phone number</label>
                <input id="call-phone" type="tel" autocomplete="tel">
                <p class="error" data-error="call-phone"></p>
              </div>
              <div class="field">
                <label for="call-when">Preferred time</label>
                <select id="call-when">
                  <option value="">Select</option>
                  <option>Morning (10:00–13:00)</option>
                  <option>Afternoon (13:00–16:00)</option>
                  <option>Evening (16:00–18:00)</option>
                </select>
                <p class="error" data-error="call-when"></p>
              </div>
              <div class="field">
                <label for="call-message">Message (optional)</label>
                <textarea id="call-message" placeholder="Course interest or a good time to call"></textarea>
              </div>
            </div>
            <p class="mt-6"><button type="submit" class="btn btn-accent">Request a Call</button></p>
          </form>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <button type="button" class="back-top" aria-label="Back to top"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  <a class="float-wa" id="float-wa" href="#" aria-label="Chat on WhatsApp" target="_blank" rel="noreferrer"><svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3.2A8.3 8.3 0 0 0 4.4 15.7L3 21l5.5-1.4A8.3 8.3 0 1 0 12 3.2zm4.8 11.8c-.2.6-1.1 1-1.5 1.1-.4 0-.8.2-2.6-.5-2.2-.9-3.6-3.1-3.7-3.3-.1-.2-1-1.3-1-2.5s.6-1.8.9-2 .5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2.1.3 0 .5l-.3.5c-.1.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.7-.1l.6-.7c.2-.2.4-.2.6-.1l1.9.9c.2.1.4.2.4.4 0 .1 0 .8-.5 1.4z"/></svg></a>
  <script src="js/data.js"></script>
  <script src="js/include.js"></script>
  <script>
    var wa = whatsappHref();
    document.getElementById("contact-cards").innerHTML =
      '<article class="contact-card"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg><p class="label">Phone</p><a href="' + SITE.phoneHref + '">' + SITE.phone + '</a></article>' +
      '<article class="contact-card"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg><p class="label">WhatsApp</p><a href="' + wa + '">' + SITE.phone + '</a></article>' +
      '<article class="contact-card"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><p class="label">Email</p><a href="mailto:' + SITE.email + '">' + SITE.email + '</a></article>' +
      '<article class="contact-card"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><p class="label">Training location</p><p>' + SITE.location + ' — ' + SITE.locationDetail + '</p></article>';
    document.getElementById("contact-socials").innerHTML =
      '<a class="btn btn-outline-ink" href="' + SITE.facebook + '" target="_blank" rel="noreferrer">Facebook</a>' +
      '<a class="btn btn-outline-ink" href="' + SITE.messenger + '" target="_blank" rel="noreferrer">Messenger</a>' +
      '<a class="btn btn-accent" href="' + wa + '" target="_blank" rel="noreferrer">WhatsApp</a>';
    document.getElementById("hours-text").textContent = "Hours: " + SITE.hours + ". We will return the call on the number you give us.";
  </script>
  <script src="js/script.js"></script>
</body>
</html>
